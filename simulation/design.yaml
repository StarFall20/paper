study: ml_assisted_utility_specification
status: active_revision_scaffold
current_primary_replications_per_condition: 30
target_replications_per_condition: 100
respondents: 400
tasks_per_respondent: 12
alternatives: 3
conditions:
  - name: additive
    nonlinear_utility: false
    threshold: false
    interaction: false
    random_taste_heterogeneity: false
  - name: nonlinear
    nonlinear_utility: true
    threshold: false
    interaction: false
    random_taste_heterogeneity: false
  - name: threshold
    nonlinear_utility: false
    threshold: true
    interaction: false
    random_taste_heterogeneity: false
  - name: interaction
    nonlinear_utility: false
    threshold: false
    interaction: true
    random_taste_heterogeneity: false
  - name: nonlinear_threshold
    nonlinear_utility: true
    threshold: true
    interaction: false
    random_taste_heterogeneity: false
  - name: nonlinear_interaction
    nonlinear_utility: true
    threshold: false
    interaction: true
    random_taste_heterogeneity: false
  - name: heterogeneity
    nonlinear_utility: false
    threshold: false
    interaction: false
    random_taste_heterogeneity: true
  - name: combined
    nonlinear_utility: true
    threshold: true
    interaction: true
    random_taste_heterogeneity: true
models:
  - mnl
  - structured_mnl
  - ml_assisted_specification
  - latent_class_mnl_extension
  - random_forest_extension
  - boosted_tree_proxy_extension
  - mixed_logit_planned
  - xgboost_planned
validation:
  grouping: decision_maker
  nested_candidate_selection: true
  current_internal_holdout: respondent_level_80_20
  external_temporal_holdout: planned_for_lpmc
  respondent_grouped_panel_validation: planned_for_swissmetro
metrics:
  current: [accuracy, logloss, brier, choice_share_rmse, decision_regret]
  planned: [coefficient_recovery, wtp_recovery, calibration, term_stability, parsimony]
